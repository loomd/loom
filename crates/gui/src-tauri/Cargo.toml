[package]
name = "loom-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
loom-core = { path = "../../core" }
reqwest = { workspace = true }
rfd = "0.17.2"
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.0.0"
tauri-plugin-autostart = "2.0.0"
tauri-plugin-updater = "2.0.0"
tauri-plugin-process = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-notification = "2.0.0"
crash-handler = "0.7"
winapi = { version = "0.3.9", features = [
  "jobapi2",
  "processthreadsapi",
  "sysinfoapi",
  "winnt",
  "winbase",
  "handleapi",
  "imm",
  "windef",
  "wingdi",
  "winuser",
  "combaseapi",
  "objbase",
] }
raw-window-handle = "0.6.2"
which = "6.0.0"
rusqlite = { version = "0.34", features = ["bundled"] }
notify = "6"

# Windows 原生 Toast：tauri-plugin-notification 在 dev 构建下会把通知挂到 PowerShell 名下，
# 点击无法回到应用。这里改用支持 on_activated 的 WinRT 实现，见 src/notification.rs。
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-registry = "0.6"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
