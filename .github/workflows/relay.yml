name: Relay Server CI & Deploy

on:
  push:
    paths:
      - 'relay/**'
      - '.github/workflows/relay.yml'
    branches: [ "main", "master" ]
  pull_request:
    paths:
      - 'relay/**'
      - '.github/workflows/relay.yml'
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Relay
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: relay/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: relay

      - name: Build TypeScript
        run: npm run build
        working-directory: relay

      - name: Validate deploy script syntax
        run: bash -n relay/deploy.sh

  deploy:
    name: Deploy to Server (https://agent.ccxcc.cn)
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH (nginx TLS + docker compose)
        uses: appleboy/ssh-action@v1.2.0
        if: ${{ env.HAS_DEPLOY_SECRET == 'true' }}
        env:
          HAS_DEPLOY_SECRET: ${{ secrets.DEPLOY_KEY != '' && secrets.DEPLOY_HOST != '' }}
        with:
          host: ${{ secrets.DEPLOY_HOST || 'agent.ccxcc.cn' }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            export REPO_URL="https://github.com/${{ github.repository }}.git"
            export APP_DIR="/opt/loom-relay"
            export DOMAIN="agent.ccxcc.cn"
            export ACME_EMAIL="${{ secrets.RELAY_ACME_EMAIL }}"

            # 首次部署：服务器上还没有仓库，先克隆再执行统一部署脚本
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if [ ! -d ".git" ]; then
              echo "==> Cloning repository"
              git clone "$REPO_URL" .
            fi
            cd relay
            bash deploy.sh

      - name: Fail if deployment secrets are missing
        if: ${{ env.HAS_DEPLOY_SECRET != 'true' }}
        env:
          HAS_DEPLOY_SECRET: ${{ secrets.DEPLOY_KEY != '' && secrets.DEPLOY_HOST != '' }}
        run: |
          echo "::error title=Deployment secrets missing::本项目仅通过 CI 自动部署。请在仓库 Settings → Secrets and variables → Actions 中配置: DEPLOY_HOST (默认 agent.ccxcc.cn)、DEPLOY_USER (默认 root)、DEPLOY_KEY (服务器 authorized_keys 对应的 SSH 私钥)、可选 DEPLOY_PORT (默认 22)、可选 RELAY_ACME_EMAIL (证书注册邮箱)。"
          exit 1


