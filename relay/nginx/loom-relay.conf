# Loom 自建中继 (Relay Server) —— HTTPS 入口
#
# TLS 在 nginx 终止，向后只走宿主机回环明文端口 127.0.0.1:9099（容器 8443）。
# 对外地址: https://agent.ccxcc.cn  (WebSocket: wss://agent.ccxcc.cn/ws/desktop)
#
# 证书要求: 服务器上已有的、覆盖 agent.ccxcc.cn 的证书（*.ccxcc.cn 泛域名亦可）。
# 部署脚本会把实际证书软链到 /etc/letsencrypt/live/agent.ccxcc.cn。
#
# WebSocket 升级头直接写在本文件内，不依赖外部 map 变量，
# 避免因 nginx 未加载 map 文件而出现 unknown "connection_upgrade" variable。

server {
    listen 80;
    listen [::]:80;
    server_name agent.ccxcc.cn;

    # ACME 校验放行，其余一律跳 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.ccxcc.cn;

    ssl_certificate     /etc/letsencrypt/live/agent.ccxcc.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.ccxcc.cn/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:loom_relay_ssl:10m;
    ssl_session_timeout 1d;

    # 中继只承载 API 与 WebSocket，体积很小
    client_max_body_size 1m;

    # WebSocket 配对 / 会话通道：固定使用 upgrade 头
    location ~ ^/ws/(desktop|mobile)$ {
        proxy_pass http://127.0.0.1:9099;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：配对码有效期 5 分钟，远程会话可能长时间静默
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 普通 API 请求
    location / {
        proxy_pass http://127.0.0.1:9099;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    "";
        proxy_set_header Connection "close";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }
}
