# Loom 自建中继 (Relay Server) —— ACME 证书签发期间的临时站点
#
# 仅监听 80，用于 certbot webroot 校验。此时证书可能尚未签发，
# 因此不能引用证书文件（否则 nginx -t 会因证书缺失而失败）。
# 证书签发完成后会被 loom-relay.conf 正式站点取代并删除。

server {
    listen 80;
    listen [::]:80;
    server_name agent.ccxcc.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
