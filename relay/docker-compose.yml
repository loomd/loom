services:
  loom-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loom-relay
    restart: unless-stopped
    # 仅绑定回环地址：TLS 由宿主机 nginx 终止，对外统一走 https://agent.ccxcc.cn
    # 容器内保持明文 HTTP/WS，不直接暴露到公网
    ports:
      - "127.0.0.1:9099:8443"
    environment:
      - PORT=8443
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 未设置，请先在 relay/.env 中写入强随机密钥}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - RELAY_ADMIN_KEY=${RELAY_ADMIN_KEY:-}
    volumes:
      - relay_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8443/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  relay_data:
    name: loom_relay_data
