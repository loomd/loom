services:
  loom-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loom-relay
    restart: unless-stopped
    ports:
      - "9099:8443"
    environment:
      - PORT=8443
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-loom_relay_production_secret_key_2026}
      - CORS_ORIGIN=*
    volumes:
      - relay_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8443/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  relay_data:
    name: loom_relay_data
