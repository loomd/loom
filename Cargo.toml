[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/gui/src-tauri"
]

[workspace.package]
version = "0.6.7"
edition = "2021"


# Centralized dependency management
[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.22.0", features = ["v4", "serde"] }
directories = "5.0.1"
dirs = "5.0"
which = "6.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
thiserror = "1.0.69"
clap = "4"
tempfile = "3.27.0"
winreg = "0.56"
